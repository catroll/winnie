[project]
name = "06langchain-lcel"
version = "0.1.0"
description = "LCEL pipe composition: prompt | model | parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "winnie-playground-common",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chains"]

[tool.uv.sources]
winnie-playground-common = { path = "../common", editable = true }
