[project]
name = "01langchain-demo"
version = "0.1.0"
description = "LangChain agent basics playground for Winnie"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "winnie-playground-common",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
winnie-playground-common = { path = "../common", editable = true }
