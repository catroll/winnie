# Winnie API configuration (no vendor keys; clients pass them through)

# Root directory for local conversation logs; files go to {log_root}/{route}/
# Relative paths are resolved against apps/api/.
log_root: ../../data/logs

# Default used when the client does not send anthropic-version.
anthropic_version: "2023-06-01"

# Optional gateway key (unrelated to vendor API keys). Empty means no check.
proxy_api_key: ""

# Path prefix -> upstream. Public paths are /{name}/v1/...
routes:
  openai:
    protocol: openai
    base_url: https://api.openai.com
  deepseek-openai:
    protocol: openai
    base_url: https://api.deepseek.com
  deepseek-anthropic:
    protocol: anthropic
    base_url: https://api.deepseek.com/anthropic
  qwen-openai:
    protocol: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode
  qwen-anthropic:
    protocol: anthropic
    base_url: https://dashscope.aliyuncs.com/apps/anthropic
  anthropic:
    protocol: anthropic
    base_url: https://api.anthropic.com

# Account system. Enabling auth creates users and sessions in the database.
auth:
  enabled: true
  # The first account can always register. Set true to allow more accounts;
  # leave false for a single-user personal deployment.
  allow_registration: false
  session_ttl_days: 30
  # Failed logins per username before a temporary lockout.
  login_max_attempts: 5
  login_window_seconds: 300
  login_lockout_seconds: 900

# Meeting notes (file-first). Enabling it mounts /api/v1/meetings.
meetings:
  enabled: true
  # Only used when auth is disabled; all meetings belong to this local user.
  default_user_id: local
  # The user's local language. Segments in other languages get a translation.
  local_language: zh
  # Only "local" is implemented.
  storage: local
  local_root: ../../data/meetings
  notes_root: ../../data/kb/meetings
  max_upload_mb: 500
  # 0 keeps audio forever. A positive value purges only audio after this many
  # days; the transcript and minutes stay available.
  audio_retention_days: 0
  # "fake" is for local demos and tests only; "volcengine" uses Doubao.
  asr_provider: volcengine
  translator: fake
  summarizer: fake
  prompt_version: v1
  # Doubao big-model recording-file ASR. The API key comes from the
  # VOLCENGINE_ASR_API_KEY environment variable (new-console API key, sent as
  # X-Api-Key); appid/access-token from the old console are not supported.
  volcengine:
    base_url: https://openspeech.bytedance.com
    # The model line: volc.seedasr.auc (2.0, current), volc.bigasr.auc (1.0).
    resource_id: volc.seedasr.auc
    # Streaming 2.0 uses the bidirectional SAUC WebSocket and its own
    # resource id. The same VOLCENGINE_ASR_API_KEY is sent as X-Api-Key.
    stream_endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
    stream_resource_id: volc.seedasr.sauc.duration
    model_name: bigmodel
    max_inline_mb: 100
    poll_interval_seconds: 2
    poll_timeout_seconds: 300

# Internal LLM access for translation and minutes. The gateway routes above
# stay independent; internal jobs call the provider directly.
# Set meetings.translator / meetings.summarizer to "openai_compatible" to use
# this block. The API key is read from the named environment variable.
llm:
  base_url: https://api.deepseek.com/v1
  api_key_env: WINNIE_LLM_API_KEY
  model: deepseek-chat
  timeout_seconds: 120
  max_output_tokens: 4096
  temperature: 0.2
  # Retry transient HTTP/transport failures; 4xx responses fail immediately.
  max_retries: 2
  retry_backoff_seconds: 1
  translation_batch_chars: 6000
  # Long transcripts are summarized in chunks, then one merge call combines
  # the partial minutes. 0 is not allowed; lower values cost more calls.
  summary_chunk_chars: 24000

# Meeting data. SQLite is the development default; production should use
# PostgreSQL, for example postgresql+asyncpg://user:pass@host:5432/winnie
database:
  url: sqlite+aiosqlite:///../../data/winnie.db
  echo: false
  # Create missing tables on startup for development. Turn this off and use
  # Alembic migrations before production.
  auto_create_tables: true

jobs:
  # inline: run in the request process, useful for local demos.
  # arq: hand the job to a separate worker.
  backend: inline
  redis_url: ""
