# Winnie API configuration (no vendor keys; clients pass them through)

# Root directory for local conversation logs; files go to {log_root}/{route}/
# Relative paths are resolved against apps/api/.
log_root: ../../data/logs

# Default used when the client does not send anthropic-version.
anthropic_version: "2023-06-01"

# Optional gateway key (unrelated to vendor API keys). Empty means no check.
proxy_api_key: ""

# Path prefix -> upstream. Public paths are /{name}/v1/...
routes:
  openai:
    protocol: openai
    base_url: https://api.openai.com
  deepseek-openai:
    protocol: openai
    base_url: https://api.deepseek.com
  deepseek-anthropic:
    protocol: anthropic
    base_url: https://api.deepseek.com/anthropic
  qwen-openai:
    protocol: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode
  qwen-anthropic:
    protocol: anthropic
    base_url: https://dashscope.aliyuncs.com/apps/anthropic
  anthropic:
    protocol: anthropic
    base_url: https://api.anthropic.com

# Admin-managed AI providers and the feature bindings that use them. On the
# first start the routes, LLM, ASR and assistant values above are imported
# into the registry file; afterwards the console (Admin -> AI providers) is
# authoritative and this block only says where that file lives. API keys are
# never written there: each provider names an environment variable.
ai:
  enabled: true
  path: ../../data/ai.yaml

# Local LLM usage ledger. Every internal model call (assistant, translation,
# minutes) and every call through the gateway appends one JSON line, grouped
# by UTC month under the root. The console's "LLM usage" page reads it and
# shows token classes, latency, estimated cost and provider balances.
usage:
  enabled: true
  root: ../../data/usage
  # Currency for the price table below. Provider-reported costs (OpenRouter
  # returns one with the response) are assumed to use the same unit.
  currency: USD
  # Estimated price per 1M tokens, keyed by model name. Add
  # "provider/model" to price the same model differently per provider, or
  # "*" as a last-resort fallback. No prices are shipped because vendor prices
  # and peak/off-peak rates change; an unlisted model is counted as unpriced
  # rather than estimated at zero. Example (DeepSeek peak rates, 2026-11):
  #   deepseek-flash:
  #     input: 0.30
  #     output: 1.20
  #     cached_input: 0.006
  prices: {}
  # Provider balance snapshots are cached this long; Refresh forces a query.
  balance_ttl_seconds: 300
  balance_timeout_seconds: 8

# Account system. Enabling auth creates users and sessions in the database.
auth:
  enabled: true
  # The first account can always register. Set true to allow more accounts;
  # leave false for a single-user personal deployment.
  allow_registration: false
  session_ttl_days: 30
  # Failed logins per username before a temporary lockout.
  login_max_attempts: 5
  login_window_seconds: 300
  login_lockout_seconds: 900

# Meeting notes (file-first). Enabling it mounts /api/v1/meetings.
meetings:
  enabled: true
  # Only used when auth is disabled; all meetings belong to this local user.
  default_user_id: local
  # The user's local language. Segments in other languages get a translation.
  local_language: zh
  # Only "local" is implemented.
  storage: local
  local_root: ../../data/meetings
  notes_root: ../../data/kb/meetings
  max_upload_mb: 500
  # 0 keeps audio forever. A positive value purges only audio after this many
  # days; the transcript and minutes stay available.
  audio_retention_days: 0
  # "fake" is for local demos and tests only; "volcengine" uses Doubao.
  # This seeds the first ASR binding; the AI providers page owns it afterwards.
  asr_provider: volcengine
  prompt_version: v1
  # Doubao big-model recording-file ASR. The API key comes from the
  # VOLCENGINE_ASR_API_KEY environment variable (new-console API key, sent as
  # X-Api-Key); appid/access-token from the old console are not supported.
  volcengine:
    base_url: https://openspeech.bytedance.com
    # The model line: volc.seedasr.auc (2.0, current), volc.bigasr.auc (1.0).
    resource_id: volc.seedasr.auc
    # Streaming 2.0 uses the bidirectional SAUC WebSocket and its own
    # resource id. The same VOLCENGINE_ASR_API_KEY is sent as X-Api-Key.
    stream_endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
    stream_resource_id: volc.seedasr.sauc.duration
    model_name: bigmodel
    max_inline_mb: 100
    poll_interval_seconds: 2
    poll_timeout_seconds: 300

# Meeting data. SQLite is the development default; production should use
# PostgreSQL, for example postgresql+asyncpg://user:pass@host:5432/winnie
database:
  url: sqlite+aiosqlite:///../../data/winnie.db
  echo: false
  # Create missing tables on startup for development. Turn this off and use
  # Alembic migrations before production.
  auto_create_tables: true

jobs:
  # inline: run in the request process, useful for local demos.
  # arq: hand the job to a separate worker.
  backend: inline
  redis_url: ""

# Personal assistant: chat, web search, scheduled tasks and local memory.
# Memory and conversations are Markdown under the assistant root, next to the
# owner's documents so the local index service can index them. The files are
# the source of truth and the service can be restarted without losing them.
assistant:
  enabled: true
  root: ~/Documents/Mine/Winnie
  timezone: Asia/Shanghai
  max_history_messages: 30
  max_tool_rounds: 4
  max_tool_output_chars: 4000
  search:
    # bing_rss needs no API key; "fake" is for offline tests.
    provider: bing_rss
    endpoint: https://cn.bing.com/search
    max_results: 5
    timeout_seconds: 15
  # The local document index serves recall over the assistant's files and the
  # owner's other documents. It is a separate loopback daemon; see
  # `make index-serve`. Disable it and search_documents reports why.
  index:
    enabled: true
    url: http://127.0.0.1:8790
    token_env: WINNIE_INDEX_TOKEN
    timeout_seconds: 5
    limit: 8
  memory:
    enabled: true
    digest_chars: 2000
    auto_distill: true
    max_facts_per_run: 12
    max_fact_chars: 500
  tasks:
    enabled: true
    # Written by the assistant when a task is created in conversation; do not
    # edit it by hand.
    file: tasks/tasks.json
    tick_seconds: 30
    catch_up_seconds: 3600
    webhook_timeout_seconds: 10
  # Local file and command tools. They are opt-in and audited. File tools stay
  # inside the configured roots; commands run as the API user and are not an OS
  # sandbox. Both require an explicit confirmation for overwrites and commands.
  workspace:
    enabled: true
    # The owner's documents and projects, not the whole home. The assistant's
    # own storage and the usual credential directories are refused even though
    # they are inside these roots. Add paths here if your files are elsewhere.
    root: "~/Documents/Mine"
    extra_roots: ["~/Projects"]
    protected: []
    max_read_bytes: 200000
    max_write_bytes: 200000
    max_list_entries: 500
    confirm_writes: true
  exec:
    enabled: true
    # Relative paths are resolved against the workspace root.
    workdir: "~/Documents/Mine"
    timeout_seconds: 30
    max_output_chars: 8000
    # Empty means any executable. A non-empty list checks argv[0]'s basename;
    # it is a guardrail, not a security boundary. Adding a shell or interpreter
    # restores full shell power.
    allow: []
    env: {}
    require_confirmation: true
    pending_ttl_seconds: 300
  # Every local action that is not on the whitelist gets one LLM review before
  # it can run. The review uses the bound assistant.chat model; a review error or malformed
  # answer denies the action. Whitelisted operations are read-only file tools
  # and a small set of read-only commands whose paths stay in the workspace.
  local:
    review:
      enabled: true
      timeout_seconds: 20
      max_action_chars: 4000
    whitelist:
      operations: ["list_files", "read_file"]
      commands: ["pwd", "ls", "cat", "head", "tail", "wc"]
      # status/rev-parse/ls-files do not run a repository diff/textconv helper.
      # Add diff, log or show only for repositories you trust.
      git_subcommands: ["status", "rev-parse", "ls-files"]

# Local document index (packages/winnie-index). The console reaches it through
# this API so the browser keeps one origin and one session; set enabled: false
# to hide the console page and the /api/v1/index/* routes.
index:
  enabled: true
  # Where the index daemon listens. It binds loopback only.
  base_url: http://127.0.0.1:8790
  # A build on a large tree can take minutes; a search should not.
  timeout_seconds: 60
