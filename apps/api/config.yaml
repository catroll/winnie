# Winnie API configuration. Vendor credentials are stored per supplier in the
# AI registry (see ai.path below), not in this file; callers authenticate to the
# gateway with a Winnie key created in the console.

# Root directory for local conversation logs; files go to {log_root}/{route}/
# Relative paths are resolved against apps/api/. A file holds the ask/answer
# pair for every gateway call.
log_root: ../../data/logs

# Default used when the client does not send anthropic-version.
anthropic_version: "2023-06-01"

# Winnie gateway keys. The file is created by the console (Admin -> Gateway
# routes) with mode 0600 and stores only a SHA-256 digest per key. A missing
# file means no key exists yet, so every gateway call answers 401.
gateway_keys_path: ../../data/gateway-keys.yaml

# Path prefix -> upstream. Any path under /{name}/ is forwarded unchanged.
# `vendor` names the supplier whose credential is injected; the key is the one
# stored on that supplier in the AI registry. These entries seed the admin
# registry; when ai.enabled is true the registry is authoritative and this block
# only matters for a gateway-only deployment, which reads
# packages/winnie-llm/.env instead.
routes:
  openai:
    protocol: openai
    base_url: https://api.openai.com
    vendor: openai
  deepseek-openai:
    protocol: openai
    base_url: https://api.deepseek.com
    vendor: deepseek
  deepseek-anthropic:
    protocol: anthropic
    base_url: https://api.deepseek.com/anthropic
    vendor: deepseek
  qwen-openai:
    protocol: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode
    vendor: qwen
  qwen-anthropic:
    protocol: anthropic
    base_url: https://dashscope.aliyuncs.com/apps/anthropic
    vendor: qwen
  anthropic:
    protocol: anthropic
    base_url: https://api.anthropic.com
    vendor: anthropic

# Admin-managed AI providers and the feature bindings that use them. On the
# first start the routes, LLM, ASR and assistant values above are imported
# into the registry file; afterwards the console (Admin -> AI providers) is
# authoritative and this block only says where that file lives. Each supplier's
# API key is stored in that file with its models; the console also mirrors it
# into packages/winnie-llm/.env as a backup.
ai:
  enabled: true
  path: ../../data/ai.yaml

# Local LLM usage ledger. Every internal model call (assistant, translation,
# minutes) and every call through the gateway appends one JSON line, grouped
# by UTC month under the root. The console's "LLM usage" page reads it and
# shows token classes, latency, estimated cost and provider balances.
usage:
  enabled: true
  root: ../../data/usage
  # Currency for the price table below. Provider-reported costs (OpenRouter
  # returns one with the response) are assumed to use the same unit.
  currency: USD
  # Estimated price per 1M tokens, keyed by model name. Add
  # "provider/model" to price the same model differently per provider, or
  # "*" as a last-resort fallback. No prices are shipped because vendor prices
  # and peak/off-peak rates change; an unlisted model is counted as unpriced
  # rather than estimated at zero. Example (DeepSeek peak rates, 2026-11):
  #   deepseek-flash:
  #     input: 0.30
  #     output: 1.20
  #     cached_input: 0.006
  prices: {}
  # Provider balance snapshots are cached this long; Refresh forces a query.
  balance_ttl_seconds: 300
  balance_timeout_seconds: 8

# Account system. Enabling auth creates users and sessions in the database.
auth:
  enabled: true
  # The first account can always register. Set true to allow more accounts;
  # leave false for a single-user personal deployment.
  allow_registration: false
  session_ttl_days: 30
  # Failed logins per username before a temporary lockout.
  login_max_attempts: 5
  login_window_seconds: 300
  login_lockout_seconds: 900

# Meeting notes (file-first). Enabling it mounts /api/v1/meetings.
meetings:
  enabled: true
  # Only used when auth is disabled; all meetings belong to this local user.
  default_user_id: local
  # The user's local language. Segments in other languages get a translation.
  local_language: zh
  # Only "local" is implemented.
  storage: local
  local_root: ../../data/meetings
  notes_root: ../../data/kb/meetings
  max_upload_mb: 500
  # 0 keeps audio forever. A positive value purges only audio after this many
  # days; the transcript and minutes stay available.
  audio_retention_days: 0
  # "fake" is for local demos and tests only; "volcengine" uses Doubao.
  # This seeds the first ASR binding; the AI providers page owns it afterwards.
  asr_provider: volcengine
  prompt_version: v1
  # Doubao big-model recording-file ASR. The API key is stored on the
  # volcengine supplier in the AI registry (the new-console API key, sent as
  # X-Api-Key); appid/access-token from the old console are not supported. This
  # block only supplies endpoint defaults for the first seed.
  volcengine:
    base_url: https://openspeech.bytedance.com
    # The model line: volc.seedasr.auc (2.0, current), volc.bigasr.auc (1.0).
    resource_id: volc.seedasr.auc
    # Streaming 2.0 uses the bidirectional SAUC WebSocket and its own
    # resource id. The same supplier key is sent as X-Api-Key.
    stream_endpoint: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
    stream_resource_id: volc.seedasr.sauc.duration
    model_name: bigmodel
    max_inline_mb: 100
    poll_interval_seconds: 2
    poll_timeout_seconds: 300

# Meeting data. SQLite is the development default; production should use
# PostgreSQL, for example postgresql+asyncpg://user:pass@host:5432/winnie
database:
  url: sqlite+aiosqlite:///../../data/winnie.db
  echo: false
  # Create missing tables on startup for development. Turn this off and use
  # Alembic migrations before production.
  auto_create_tables: true

jobs:
  # inline: run in the request process, useful for local demos.
  # arq: hand the job to a separate worker.
  backend: inline
  redis_url: ""

# Personal assistant: chat, web search, scheduled tasks and local memory.
# Memory and conversations are Markdown under the assistant root, next to the
# owner's documents so the local index service can index them. The files are
# the source of truth and the service can be restarted without losing them.
assistant:
  enabled: true
  root: ~/Documents/Mine/Winnie
  timezone: Asia/Shanghai
  max_history_messages: 30
  max_tool_rounds: 4
  max_tool_output_chars: 4000
  search:
    # bing_rss needs no API key; "fake" is for offline tests.
    provider: bing_rss
    endpoint: https://cn.bing.com/search
    max_results: 5
    timeout_seconds: 15
  # The local document index serves recall over the assistant's files and the
  # owner's other documents. It is a separate loopback daemon; see
  # `make index-serve`. Disable it and search_documents reports why.
  index:
    enabled: true
    url: http://127.0.0.1:8790
    token_env: WINNIE_INDEX_TOKEN
    timeout_seconds: 5
    limit: 8
  memory:
    enabled: true
    # Pinned categories (identity, preferences, procedures, constraints) are in
    # every prompt; this bounds their size.
    digest_chars: 3000
    auto_distill: true
    max_facts_per_run: 12
    max_fact_chars: 500
    # Per-turn retrieval: the notes matched to the conversation are added to the
    # prompt as well. recall_limit = 0 disables it.
    recall_limit: 6
    recall_chars: 1200
    # Recent messages the match looks at, so "那明天呢？" still finds its subject.
    recall_context_messages: 6
  tasks:
    enabled: true
    # Written by the assistant when a task is created in conversation; do not
    # edit it by hand.
    file: tasks/tasks.json
    tick_seconds: 30
    catch_up_seconds: 3600
    webhook_timeout_seconds: 10
    # Push each scheduled task's result to the owner's phone when push is
    # enabled. Turn this off for tasks that are only bookkeeping.
    notify_results: true
  # Default weather feature: a daily forecast check that records an umbrella,
  # clothing or severe-weather notice only when the advice changed. The weather
  # skill in the admin console turns both the chat tool and this watcher off.
  weather:
    enabled: true
    location: 上海
    latitude: 31.2304
    longitude: 121.4737
    # The scheduled check follows the owner's rule: a phone fix newer than
    # phone_fix_max_age_minutes wins, otherwise the place above. Set
    # follow_phone: false to always use the configured place.
    follow_phone: true
    phone_fix_max_age_minutes: 120
    # "every 3h" is also valid; duplicate advice is not sent twice a day.
    schedule: daily 07:00
    webhook: ""
    rain_probability: 50
    temperature_delta: 5
    heat_threshold: 35
    cold_threshold: 0
    wind_threshold: 39
    timeout_seconds: 15
    webhook_timeout_seconds: 10
    tick_seconds: 30
  # Gold price watch: sample gold-api.com and push an alert to the Winnie app
  # when the price moves sharply. Samples are kept on disk because the keyless
  # feed has no candles; a 60-minute window needs about 60 minutes of uptime.
  gold:
    enabled: true
    symbol: XAU
    schedule: every 5m
    window_minutes: 60
    threshold_percent: 1.0
    daily_threshold_percent: 2.5
    cooldown_minutes: 120
    history_hours: 48
    timeout_seconds: 15
    tick_seconds: 30
  # Local file and command tools. They are opt-in and audited. File tools stay
  # inside the configured roots; commands run as the API user and are not an OS
  # sandbox. Both require an explicit confirmation for overwrites and commands.
  workspace:
    enabled: true
    # The owner's documents and projects, not the whole home. The assistant's
    # own storage and the usual credential directories are refused even though
    # they are inside these roots. Add paths here if your files are elsewhere.
    root: "~/Documents/Mine"
    extra_roots: ["~/Projects"]
    protected: []
    max_read_bytes: 200000
    max_write_bytes: 200000
    max_list_entries: 500
    confirm_writes: true
  exec:
    enabled: true
    # Relative paths are resolved against the workspace root.
    workdir: "~/Documents/Mine"
    timeout_seconds: 30
    max_output_chars: 8000
    # Empty means any executable. A non-empty list checks argv[0]'s basename;
    # it is a guardrail, not a security boundary. Adding a shell or interpreter
    # restores full shell power.
    allow: []
    env: {}
    require_confirmation: true
    pending_ttl_seconds: 300
  # Every local action that is not on the whitelist gets one LLM review before
  # it can run. The review uses the bound assistant.chat model; a review error or malformed
  # answer denies the action. Whitelisted operations are read-only file tools
  # and a small set of read-only commands whose paths stay in the workspace.
  local:
    review:
      enabled: true
      timeout_seconds: 20
      max_action_chars: 4000
    whitelist:
      operations: ["list_files", "read_file"]
      commands: ["pwd", "ls", "cat", "head", "tail", "wc"]
      # status/rev-parse/ls-files do not run a repository diff/textconv helper.
      # Add diff, log or show only for repositories you trust.
      git_subcommands: ["status", "rev-parse", "ls-files"]

# News production pipeline (packages/winnie-news). A run collects material,
# cleans and extracts it, groups reports of one event, searches for missing
# coverage, writes one draft per event, reviews it, and assembles the drafts
# that passed into a dated digest. The model bindings are news.extract /
# news.write / news.review on the AI providers page; a fresh registry binds them
# to the deterministic fake, so a first run works offline. Disabling this hides
# /api/v1/news and leaves the data under root untouched.
news:
  enabled: true
  # Runs, drafts, reviews and the long-lived events.json live here.
  root: ../../data/news
  # The language drafts are written in; it overrides writing.language below.
  language: zh
  material:
    # Empty means every source enabled in the packaged sources.json.
    source_types: []
    rss_feed_ids: []
    # null keeps each RSS feed's configured max_items.
    rss_limit: null
    cache_dir: cache/material
    max_age_seconds: 3600
    workers: 5
    # Optional registry overrides; empty uses the files shipped in the package.
    sources_file: ""
    rss_sources_file: ""
  clean:
    # A longer body is truncated only for the model call, not in the document.
    max_content_chars: 6000
    min_title_chars: 4
    min_total_chars: 12
    # 0 disables the publication-age filter (hot lists carry no date).
    max_age_days: 0
    # Extractions below this score are dropped as not worth writing from.
    min_quality_score: 0.3
    max_items: 200
    concurrency: 3
  aggregate:
    # Merge without asking the model only above auto_threshold AND with an
    # anchor (shared rare actor, number or object).
    auto_threshold: 0.85
    # Between the two thresholds one verification call decides; below
    # gray_threshold the report starts a new event.
    gray_threshold: 0.55
    window_days: 7
    max_candidates: 50
    max_articles_per_event: 200
    verify_concurrency: 3
  search:
    # Search reuses the assistant's provider (assistant.search above).
    queries_per_event: 3
    results_per_query: 5
    concurrency: 3
    min_snippet_chars: 20
  writing:
    language: zh
    # The plugin's 内容规则 1: about 200 characters, extendable to 300 to explain
    # background. Review quotes these numbers; it adds no threshold of its own.
    target_chars: 200
    max_chars: 300
    audience: general readers
    style: plain news report
    # A position the text must present plainly when it is set. Empty means
    # neutral reporting.
    stance: ""
    allow_commentary: false
  digest:
    # The batch briefing assembled from the drafts that passed review.
    # Calendar days ending today: 2 means today and yesterday; 0 disables it.
    window_days: 2
    # The most items one digest carries; the newest win.
    max_items: 30
    # The format saved as digest.md; the API renders the others on request.
    format: standard
    # A draft that did not pass review stays out unless this is true.
    include_needs_review: false
  # A failed review returns feedback to the writer at most this many times;
  # after that the draft is marked needs_human.
  max_review_retries: 2
  # Older runs are pruned after a successful run.
  keep_runs: 50

# The owner's weekly schedule (packages/winnie-schedule). One file per week in
# a Markdown tree outside this repository; the console reads and edits it in
# place. Set enabled: false to hide the console page and the /api/v1/schedule/*
# routes. `root` is the WLB checkout, absolute or starting with ~.
schedule:
  enabled: true
  root: ~/Projects/Mine/WLB

# The owner's mailbox (packages/winnie-mail). One account per user, stored in a
# mode-0600 YAML file under `root` and edited from the console's Settings page.
# The same account sends the proactive email rung and can be read over IMAP or
# POP3; nothing secret is ever returned by the API. `proactive.channels.email`
# below stays as the environment-backed fallback for an account that has not
# been saved yet. Set enabled: false to hide the Settings mail form and the
# /api/v1/settings/mail routes.
mail:
  enabled: true
  root: ../../data/mail
  # A mailbox that cannot answer a login in this long is reported as a timeout
  # by the Settings page instead of holding the request open.
  default_timeout_seconds: 20.0

# Proactive assistance (packages/winnie-proactive): birthdays, leave-by
# reminders and the digest. Detection is code and never calls a model; the
# channels below only carry what was already decided. `public_url` is the
# address the owner's phone or mail client can reach, used to build the
# acknowledgement link; empty means no link in those two channels.
proactive:
  enabled: true
  # The address the phone and mail client can reach; used for ack links.
  public_url: http://eqr.hosts.d3v.cn:8000
  timezone: Asia/Shanghai
  root: ../../data/proactive
  horizon_days: 120
  quiet_hours: ["22:30", "07:30"]
  max_interrupts_per_day: 4
  channels:
    order: [push, ntfy, email]
    ntfy:
      enabled: true
      server: https://ntfy.sh
      # The topic is a secret on a public server; set WINNIE_NTFY_TOPIC in
      # apps/api/.env instead of writing it here.
      topic: ""
      topic_env: WINNIE_NTFY_TOPIC
    email:
      enabled: true
      to: ninedoors@126.com
      from_address: ninedoors@126.com
      smtp_host: smtp.126.com
      smtp_port: 465
  escalation:
    after_minutes: [20, 60]
  # The model may rewrite the body once, just before the first send. Off means
  # the deterministic template is sent; a failure falls back to it either way.
  composer:
    enabled: true

# Local document index (packages/winnie-index). The console reaches it through
# this API so the browser keeps one origin and one session; set enabled: false
# to hide the console page and the /api/v1/index/* routes.
index:
  enabled: true
  # Where the index daemon listens. It binds loopback only.
  base_url: http://127.0.0.1:8790
  # A build on a large tree can take minutes; a search should not.
  timeout_seconds: 60

# Phone data sync from the Winnie Android client. The phone is the only writer
# of its own data: calendar, call log, SMS, contacts, notifications, location
# fixes and installed apps are uploaded in batches and merged by device and
# external id. The assistant reads them through the phone skills; writes are
# proposed in chat, confirmed by the owner and executed by the phone on its
# next sync. This is personal data: enable it only on a machine you control
# and see docs/phone.md for retention and security notes.
phone:
  enabled: true
  # The account whose phone the assistant reads. Empty means the only active
  # account, or the local user when accounts are disabled. Set it explicitly
  # when the instance has more than one account.
  owner_user: ""
  # Returned to the client as a hint; Android's own minimum is 15 minutes.
  sync_interval_minutes: 30
  # One request carries at most this many items of one kind; the client pages
  # larger histories. A "full" calendar/contact/app snapshot must fit one page.
  max_batch_items: 200
  # Long text is truncated before it is stored.
  max_text_chars: 8000
  # A proposed write expires if the owner never confirms it.
  command_ttl_seconds: 900
  max_commands_per_poll: 10
  # 0 keeps everything. Contacts and apps are snapshots rather than history,
  # so their windows only prune tombstones. Calls and SMS are kept whole: the
  # owner wants the full history, and 13 988 messages were reduced to the last
  # year's 343 by the old 365-day window. A calendar row that repeats is never
  # pruned by age while the series still has occurrences ahead; see
  # PhoneService._purge_calendar_before.
  retention:
    calendar_days: 730
    call_days: 0
    message_days: 0
    contact_days: 0
    notification_days: 14
    location_days: 30
    app_days: 0

  # Reverse geocoding turns a fix into 省 + 市 + 区 + 具体位置 on the console and
  # for the assistant. Turning it on sends the owner's coordinates to a third
  # party, so it is a deliberate choice; a fix that cannot be resolved keeps its
  # raw coordinates and the address stays empty.
  #
  # provider: photon is keyless and names the nearest OpenStreetMap feature plus
  # the city and district around it, which is the rough answer. provider: amap
  # resolves street addresses and needs a key in the environment (AMAP_API_KEY,
  # never a config file); Amap speaks GCJ-02, so the WGS-84 fix the phone reports
  # is converted before it is sent.
  geocode:
    enabled: true
    provider: photon
    key_env: AMAP_API_KEY
    coordinate_system: wgs84
    timeout_seconds: 2.5
    min_interval_seconds: 1.0
    cache_entries: 512
    # How long a stored address stays usable for the same place (~150 m). The
    # provider is metered, so a restart must not buy the same answer again. 0
    # turns the reuse off.
    reuse_days: 30
    max_per_sync: 5

# Push notifications to the Android client. The server writes each event to the
# database first and then hands it to the open WebSocket, so a phone that was
# offline still receives the reminder when it reconnects. There is no vendor
# push service: the app holds the socket open from a foreground service, and a
# WorkManager pull is the fallback when the service is not running.
push:
  enabled: true
  # Notifications older than this are deleted even if never delivered.
  retention_days: 30
  # A reconnecting client receives at most this many backlog events.
  max_backlog: 200
  # Server heartbeat on the WebSocket, so a dead NAT mapping is noticed.
  heartbeat_seconds: 25
  # One slow client must not grow an unbounded in-memory queue.
  max_queue: 100
  # How often the retention pass runs while the API is up.
  prune_interval_seconds: 3600
