[project]
name = "winnie-api"
version = "0.1.0"
description = "Winnie personal assistant backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "arq>=0.28.0",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
    "alembic>=1.20.1",
    "winnie-core",
    "winnie-gateway",
    "winnie-meetings",
    "winnie-knowledge",
    "winnie-assistant",
    "winnie-chat",
    "winnie-local",
    "winnie-news",
    "winnie-phone",
    "winnie-proactive",
    "winnie-schedule",
    "winnie-push",
    "winnie-llm",
    "winnie-mail",
]

[tool.uv.sources]
winnie-core = { path = "../../packages/winnie-core", editable = true }
winnie-gateway = { path = "../../packages/winnie-gateway", editable = true }
winnie-meetings = { path = "../../packages/winnie-meetings", editable = true }
winnie-knowledge = { path = "../../packages/winnie-knowledge", editable = true }
winnie-assistant = { path = "../../packages/winnie-assistant", editable = true }
winnie-chat = { path = "../../packages/winnie-chat", editable = true }
winnie-local = { path = "../../packages/winnie-local", editable = true }
winnie-news = { path = "../../packages/winnie-news", editable = true }
winnie-phone = { path = "../../packages/winnie-phone", editable = true }
winnie-proactive = { path = "../../packages/winnie-proactive", editable = true }
winnie-schedule = { path = "../../packages/winnie-schedule", editable = true }
winnie-push = { path = "../../packages/winnie-push", editable = true }
winnie-llm = { path = "../../packages/winnie-llm", editable = true }
winnie-mail = { path = "../../packages/winnie-mail", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_api"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
