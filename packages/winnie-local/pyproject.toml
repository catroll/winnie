[project]
name = "winnie-local"
version = "0.1.0"
description = "Confined local file and command execution with LLM review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_local"]
