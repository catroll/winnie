[project]
name = "winnie-mail"
version = "0.1.0"
description = "Per-user mailbox settings with SMTP sending and IMAP/POP3 reading"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_mail"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
