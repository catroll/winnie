[project]
name = "winnie-gateway"
version = "0.1.0"
description = "Winnie's OpenAI/Anthropic gateway with server-held vendor credentials"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_gateway"]
