[project]
name = "winnie-assistant"
version = "0.1.0"
description = "Winnie assistant capability: chat, tools, memory and scheduled tasks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "winnie-core",
    "winnie-chat",
    "winnie-local",
    "winnie-llm",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }
winnie-chat = { path = "../winnie-chat", editable = true }
winnie-local = { path = "../winnie-local", editable = true }
winnie-llm = { path = "../winnie-llm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_assistant"]
