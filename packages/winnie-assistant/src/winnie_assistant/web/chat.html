<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Winnie</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1216;
      --panel: #151b21;
      --line: #24303a;
      --text: #e6edf3;
      --muted: #8b9aa7;
      --accent: #4fb3ff;
      --user: #1d3a52;
      --assistant: #1a222a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header .name { font-weight: 600; letter-spacing: 0.02em; }
    header .spacer { flex: 1; }
    button {
      font: inherit;
      color: var(--text);
      background: #1c2630;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }
    button:hover { border-color: #3b4d5c; }
    button:disabled { opacity: 0.55; cursor: default; }
    button.primary { background: var(--accent); color: #04121e; border-color: var(--accent); font-weight: 600; }
    #settings { display: none; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    #settings.open { display: block; }
    #settings label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
    #settings input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0c1116;
      color: var(--text);
      font: inherit;
    }
    #settings .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    #status { color: var(--muted); font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    main { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
    .msg {
      max-width: min(680px, 88%);
      padding: 10px 13px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: #3a1f22; border: 1px solid #5d2b30; color: #ffb4b4; font-size: 13px; }
    .msg .tools { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 360px; }
    .empty h1 { font-size: 20px; color: var(--text); margin: 0 0 6px; }
    .typing { color: var(--muted); font-size: 13px; align-self: flex-start; }
    form {
      display: flex;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--panel);
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      max-height: 140px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0c1116;
      color: var(--text);
      font: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    @media (max-width: 480px) {
      header { padding: 8px 10px; }
      main { padding: 12px 10px 6px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="name">Winnie</span>
    <span class="spacer"></span>
    <button id="new-chat" type="button">New chat</button>
    <button id="settings-toggle" type="button">Settings</button>
  </header>

  <section id="settings">
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token from /api/v1/auth/login" />
    <div class="row">
      <button id="save-token" type="button" class="primary">Save</button>
      <button id="clear-token" type="button">Clear</button>
    </div>
    <div id="status">status: not checked</div>
  </section>

  <main id="messages">
    <div class="empty">
      <h1>Ask Winnie</h1>
      <div>Chat, web search and scheduled tasks. Every exchange is stored locally.</div>
    </div>
  </main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message Winnie…" autocomplete="off"></textarea>
    <button id="send" type="submit" class="primary">Send</button>
  </form>

  <script>
    const API = location.pathname.replace(/\/ui$/, "");
    const EMPTY = document.querySelector(".empty").outerHTML;
    let conversationId = null;
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const token = () => localStorage.getItem("winnie.token") || "";

    function setPanel(open) {
      $("settings").classList.toggle("open", open);
      if (open) { $("token").value = token(); $("token").focus(); }
    }

    function addMessage(role, text, tools) {
      const empty = document.querySelector(".empty");
      if (empty) empty.remove();
      const node = document.createElement("div");
      node.className = "msg " + role;
      node.textContent = text;
      if (tools && tools.length) {
        const note = document.createElement("span");
        note.className = "tools";
        note.textContent = "tools: " + tools.join(", ");
        node.appendChild(note);
      }
      $("messages").appendChild(node);
      $("messages").scrollTop = $("messages").scrollHeight;
      return node;
    }

    async function request(path, options) {
      const settings = options || {};
      const headers = settings.body ? { "content-type": "application/json" } : {};
      if (token()) headers.authorization = "Bearer " + token();
      return fetch(API + path, Object.assign({}, settings, { headers }));
    }

    async function send() {
      const input = $("input");
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = "";
      input.style.height = "auto";
      addMessage("user", text);
      busy = true;
      $("send").disabled = true;
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Winnie is thinking…";
      $("messages").appendChild(typing);
      try {
        const response = await request("/chat", {
          method: "POST",
          body: JSON.stringify({
            message: text,
            conversation_id: conversationId,
            channel: "web",
          }),
        });
        typing.remove();
        if (response.status === 401) {
          addMessage("error", "Access token required. Open Settings and paste one.");
          setPanel(true);
          return;
        }
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          addMessage("error", body.detail || "request failed: HTTP " + response.status);
          return;
        }
        conversationId = body.conversation_id;
        addMessage("assistant", body.reply, body.tools_used);
      } catch (error) {
        typing.remove();
        addMessage("error", "network error: " + error.message);
      } finally {
        busy = false;
        $("send").disabled = false;
        $("input").focus();
      }
    }

    async function loadStatus() {
      try {
        const response = await request("/status");
        if (!response.ok) {
          $("status").textContent = "status: HTTP " + response.status;
          return;
        }
        const body = await response.json();
        $("status").textContent =
          "model " + body.model +
          " · search " + body.search +
          " · " + body.conversations + " conversations" +
          " · " + body.memory.entries + " memory entries" +
          " · " + body.scheduler.tasks + " scheduled tasks";
      } catch (error) {
        $("status").textContent = "status unavailable: " + error.message;
      }
    }

    $("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      send();
    });

    $("input").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });

    $("input").addEventListener("input", () => {
      const input = $("input");
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    $("new-chat").addEventListener("click", () => {
      conversationId = null;
      $("messages").innerHTML = EMPTY;
      $("input").focus();
    });

    $("settings-toggle").addEventListener("click", () => {
      const open = !$("settings").classList.contains("open");
      setPanel(open);
      if (open) loadStatus();
    });

    $("save-token").addEventListener("click", () => {
      const value = $("token").value.trim();
      if (value) localStorage.setItem("winnie.token", value);
      else localStorage.removeItem("winnie.token");
      setPanel(false);
    });

    $("clear-token").addEventListener("click", () => {
      localStorage.removeItem("winnie.token");
      $("token").value = "";
      $("status").textContent = "status: token cleared";
    });
  </script>
</body>
</html>
