[project]
name = "winnie-news"
version = "0.1.0"
description = "Winnie news production pipeline: material, clean, aggregate, search, generate, review"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "winnie-core",
    "winnie-llm",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }
winnie-llm = { path = "../winnie-llm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_news"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
