[project]
name = "winnie-proactive"
version = "0.1.0"
description = "Proactive interventions: detection, policy, composition and tracked delivery"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_proactive"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
