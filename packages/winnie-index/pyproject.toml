[project]
name = "winnie-index"
version = "0.1.0"
description = "Local text and Markdown index with FTS5 retrieval, MCP and HTTP surfaces"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_index"]

[project.scripts]
winnie-index = "winnie_index.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
