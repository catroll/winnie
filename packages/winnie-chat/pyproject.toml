[project]
name = "winnie-chat"
version = "0.1.0"
description = "Winnie chat engine: model loop, skills, and prompt assembly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "winnie-core",
    "winnie-llm",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }
winnie-llm = { path = "../winnie-llm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_chat"]
