[project]
name = "winnie-phone"
version = "0.1.0"
description = "Phone data sync: calendar, calls, SMS, contacts, notifications, location and apps"
requires-python = ">=3.11"
dependencies = [
    # Lunar ↔ solar conversion for calendar rules stored in a Chinese
    # provider's dialect. borax is MIT and pure Python; lunardate and zhdate
    # are GPL (this project is Apache-2.0), cnlunar has no lunar→solar
    # direction, and sxtwl is a compiled wheel with no aarch64 build.
    # See docs/decisions.md, "A yearly event may carry its lunar date".
    "borax>=4.1.3",
    "pydantic>=2.13.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_phone"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
