[project]
name = "winnie-phone"
version = "0.1.0"
description = "Phone data sync: calendar, calls, SMS, contacts, notifications, location and apps"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_phone"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
