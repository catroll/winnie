[project]
name = "winnie-push"
version = "0.1.0"
description = "Durable push notifications and the WebSocket stream the app keeps open"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "winnie-core",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_push"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
