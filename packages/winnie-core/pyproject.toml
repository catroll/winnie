[project]
name = "winnie-core"
version = "0.1.0"
description = "Winnie framework: auth, database, storage, jobs and internal LLM access"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_core"]
