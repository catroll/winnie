[project]
name = "winnie-meetings"
version = "0.1.0"
description = "Winnie meeting-notes capability"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "websockets>=17.0",
    "python-multipart>=0.0.32",
    "winnie-core",
    "winnie-knowledge",
]

[tool.uv.sources]
winnie-core = { path = "../winnie-core", editable = true }
winnie-knowledge = { path = "../winnie-knowledge", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnie_meetings"]
